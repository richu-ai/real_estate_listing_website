<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add New Property | Premium Real Estate Listings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
    <div class="container" style="max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9;">
        <header style="margin-bottom: 20px;">
            <h1 style="font-family: Arial, sans-serif; color: #333;">Add New Property</h1>
            <nav style="margin-top: 10px;">
                <a href="{{ url_for('properties') }}" style="text-decoration: none; color: #007BFF;">Back to Properties</a>
            </nav>
        </header>
        <main>
            <form method="POST" action="{{ url_for('new_property') }}">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="title" style="display: block; font-weight: bold; margin-bottom: 5px;">Property Title</label>
                    <input type="text" id="title" name="title" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="address" style="display: block; font-weight: bold; margin-bottom: 5px;">Property Address</label>
                    <input type="text" id="address" name="address" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="agent_id" style="display: block; font-weight: bold; margin-bottom: 5px;">Agent ID</label>
                    <input type="number" id="agent_id" name="agent_id" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="description" style="display: block; font-weight: bold; margin-bottom: 5px;">Property Description</label>
                    <textarea id="description" name="description" rows="5" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="price" style="display: block; font-weight: bold; margin-bottom: 5px;">Price ($)</label>
                    <input type="number" id="price" name="price" step="0.01" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
                </div>
                <button type="submit" class="btn btn-primary" style="background-color: #007BFF; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">Add Property</button>
            </form>
        </main>
    </div>
</body>
</html>
